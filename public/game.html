          };

          checkGoal(this.p1);
          if (this.isTwoPlayer) checkGoal(this.p2);
        }

        // 12. Check Game Over (both players dead)
        if (!this.p1.isAlive && (!this.isTwoPlayer || !this.p2.isAlive)) {
          this.state = GameState.GAME_OVER;
          sound.playGameOver();

          const totalScore = this.p1.score + (this.isTwoPlayer ? this.p2.score : 0);
          if (totalScore > this.highScore) {
            this.highScore = totalScore;
            localStorage.setItem('rabbit_runner_highscore', this.highScore);
          }
        }

        // 13. Update Particles & Floating Texts
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update();
          if (this.particles[i].life <= 0) {
            this.particles.splice(i, 1);
          }
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          this.floatingTexts[i].update();
          if (this.floatingTexts[i].life <= 0) {
            this.floatingTexts.splice(i, 1);
          }
        }
      }

      // ==========================================
      // RENDERING ENGINE
      // ==========================================
      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const theme = StageThemes[this.currentStage];

        // Screen Shake offset
        ctx.save();
        if (this.screenShake > 0.5) {
          const shakeX = (Math.random() - 0.5) * this.screenShake;
          const shakeY = (Math.random() - 0.5) * this.screenShake;
          ctx.translate(shakeX, shakeY);
        }

        // 1. Draw Parallax Background
        this.drawBackground(ctx, theme);

        // 2. Draw World Entities (offset by cameraX)
        ctx.save();
        ctx.translate(-Math.floor(this.cameraX), 0);

        // Ground & Pits
        this.drawGround(ctx, theme);

        // Blocks
        this.blocks.forEach(b => b.draw(ctx, theme));

        // Hazards
        this.hazards.forEach(h => h.draw(ctx));

        // Carrots
        this.carrots.forEach(c => c.draw(ctx));

        // Power-ups
        this.powerUps.forEach(pu => pu.draw(ctx));

        // Goal Flag
        if (this.goalFlag) this.goalFlag.draw(ctx);

        // Enemies
        this.enemies.forEach(en => en.draw(ctx));

        // Boss
        if (this.boss) this.boss.draw(ctx);

        // Players
        this.p1.draw(ctx);
        if (this.isTwoPlayer) this.p2.draw(ctx);

        // Particles
        this.particles.forEach(p => p.draw(ctx));

        // Floating texts
        this.floatingTexts.forEach(ft => ft.draw(ctx));

        ctx.restore(); // restore camera translation
        ctx.restore(); // restore screen shake

        // 3. Draw HUD (Screen space)
        if (this.state === GameState.PLAYING || this.state === GameState.PAUSED) {
          this.drawHUD(ctx, theme);
        }

        // 4. Draw Overlay Screens (Menu, Paused, Stage Clear, Game Over, Victory)
        if (this.state === GameState.MENU) {
          this.drawMenuScreen(ctx);
        } else if (this.state === GameState.PAUSED) {
          this.drawPauseScreen(ctx);
        } else if (this.state === GameState.STAGE_CLEAR) {
          this.drawStageClearScreen(ctx);
        } else if (this.state === GameState.GAME_OVER) {
          this.drawGameOverScreen(ctx);
        } else if (this.state === GameState.VICTORY) {
          this.drawVictoryScreen(ctx);
        }
      }

      drawBackground(ctx, theme) {
        // Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
        skyGrad.addColorStop(0, theme.skyTop);
        skyGrad.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Celestial Body (Sun/Moon)
        ctx.fillStyle = theme.sunColor;
        ctx.beginPath();
        ctx.arc(CANVAS_WIDTH - 120, 80, 36, 0, Math.PI * 2);
        ctx.fill();

        // Stage 3 Starfield
        if (this.currentStage === 3) {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 40; i++) {
            const sx = (i * 123) % CANVAS_WIDTH;
            const sy = (i * 77) % 200;
            const sz = (i % 3 === 0) ? 2 : 1;
            ctx.fillRect(sx, sy, sz, sz);
          }
        }

        // Distant Parallax Hills (Layer 1)
        ctx.fillStyle = theme.hill1;
        ctx.beginPath();
        ctx.moveTo(0, CANVAS_HEIGHT);
        const hillOffset1 = (this.cameraX * 0.15) % CANVAS_WIDTH;
        for (let x = -CANVAS_WIDTH; x <= CANVAS_WIDTH * 2; x += 120) {
          ctx.quadraticCurveTo(x - hillOffset1 + 60, GROUND_Y - 90, x - hillOffset1 + 120, GROUND_Y - 20);
        }
        ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.lineTo(0, CANVAS_HEIGHT);
        ctx.fill();

        // Fluffy Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        this.clouds.forEach(c => {
          c.x -= c.sp;
          if (c.x < -150) c.x = CANVAS_WIDTH + 150;
          this.drawCloud(ctx, c.x, c.y, c.s);
        });

        // Nearer Parallax Hills / Trees (Layer 2)
        ctx.fillStyle = theme.hill2;
        ctx.beginPath();
        ctx.moveTo(0, CANVAS_HEIGHT);
        const hillOffset2 = (this.cameraX * 0.35) % CANVAS_WIDTH;
        for (let x = -CANVAS_WIDTH; x <= CANVAS_WIDTH * 2; x += 160) {
          ctx.quadraticCurveTo(x - hillOffset2 + 80, GROUND_Y - 50, x - hillOffset2 + 160, GROUND_Y);
        }
        ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.lineTo(0, CANVAS_HEIGHT);
        ctx.fill();
      }

      drawCloud(ctx, x, y, scale = 1.0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.arc(14, -8, 20, 0, Math.PI * 2);
        ctx.arc(32, -4, 16, 0, Math.PI * 2);
        ctx.arc(42, 4, 14, 0, Math.PI * 2);
        ctx.arc(18, 8, 16, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      drawGround(ctx, theme) {
        // Draw normal ground in segments, skipping pits
        let curX = -100;
        const endX = this.levelLength + 400;

        // Sort pits by start
        const sortedPits = [...this.pits].sort((a, b) => a.start - b.start);

        for (const pit of sortedPits) {
          if (pit.start > curX) {
            this.drawGroundSegment(ctx, curX, pit.start, theme);
          }
          curX = Math.max(curX, pit.end);
        }

        if (curX < endX) {
          this.drawGroundSegment(ctx, curX, endX, theme);
        }
      }

      drawGroundSegment(ctx, startX, endX, theme) {
        const segW = endX - startX;
        if (segW <= 0) return;

        // Top Grass/Sand surface
        ctx.fillStyle = theme.groundTop;
        ctx.fillRect(startX, GROUND_Y, segW, 14);

        // Dirt underlayer
        ctx.fillStyle = theme.groundDirt;
        ctx.fillRect(startX, GROUND_Y + 14, segW, CANVAS_HEIGHT - (GROUND_Y + 14));

        // Subtle dirt brick pattern
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        for (let bx = Math.floor(startX / 32) * 32; bx < endX; bx += 32) {
          for (let by = GROUND_Y + 16; by < CANVAS_HEIGHT; by += 20) {
            ctx.fillRect(bx, by, 30, 18);
          }
        }
      }

      // ==========================================
      // HUD (HEADS-UP DISPLAY)
      // ==========================================
      drawHUD(ctx, theme) {
        ctx.save();

        // Top HUD Bar Glass container
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(16, 12, CANVAS_WIDTH - 32, 46);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(16, 12, CANVAS_WIDTH - 32, 46);

        // Player 1 Stats
        ctx.font = 'bold 12px "Press Start 2P", monospace';
        ctx.fillStyle = '#60a5fa';
        ctx.fillText('P1', 30, 32);

        // P1 Hearts
        let heartsP1 = '';
        for (let i = 0; i < 3; i++) {
          heartsP1 += i < this.p1.lives ? '❤️' : '🖤';
        }
        ctx.font = '14px sans-serif';
        ctx.fillText(heartsP1, 62, 34);

        // P1 Carrots & Score
        ctx.font = 'bold 11px "Press Start 2P", monospace';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`🥕${this.p1.carrotsCollected}  ${this.p1.score}`, 125, 33);

        // Player 2 Stats (if active)
        if (this.isTwoPlayer) {
          ctx.fillStyle = '#f87171';
          ctx.fillText('P2', 290, 32);

          let heartsP2 = '';
          for (let i = 0; i < 3; i++) {
            heartsP2 += i < this.p2.lives ? '❤️' : '🖤';
          }
          ctx.font = '14px sans-serif';
          ctx.fillText(heartsP2, 322, 34);

          ctx.font = 'bold 11px "Press Start 2P", monospace';
          ctx.fillStyle = '#fbbf24';
          ctx.fillText(`🥕${this.p2.carrotsCollected}  ${this.p2.score}`, 385, 33);
        }

        // Center Stage Indicator
        ctx.font = 'bold 10px "Press Start 2P", monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(theme.shortName.toUpperCase(), CANVAS_WIDTH / 2, 28);

        // Stage progress bar
        const progW = 120;
        const progX = CANVAS_WIDTH / 2 - progW / 2;
        const progY = 36;
        const p1Dist = Math.max(0, Math.min(1, this.p1.x / this.levelLength));

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(progX, progY, progW, 6);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(progX, progY, progW * p1Dist, 6);

        // High Score
        ctx.textAlign = 'right';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.fillText(`HI: ${this.highScore}`, CANVAS_WIDTH - 30, 32);

        // Active Combo Badge
        if (this.comboCount > 1) {
          ctx.textAlign = 'left';
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 12px "Press Start 2P", monospace';
          ctx.fillText(`COMBO x${this.comboCount}!`, 30, 80);
        }

        ctx.restore();
      }

      // ==========================================
      // MENUS & OVERLAY SCREENS
      // ==========================================
      drawMenuScreen(ctx) {
        // Darkened glass backdrop
        ctx.fillStyle = 'rgba(8, 7, 17, 0.88)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Game Logo Title
        ctx.save();
        ctx.textAlign = 'center';

        const bounce = Math.sin(Date.now() / 250) * 8;
        ctx.font = 'bold 36px "Press Start 2P", monospace';
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 18;
        ctx.fillText('RABBIT RUNNER', CANVAS_WIDTH / 2, 110 + bounce);

        ctx.shadowBlur = 0;
        ctx.font = 'bold 13px "Outfit", sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.letterSpacing = '2px';
        ctx.fillText('★ 16-BIT RETRO PLATFORMER ADVENTURE ★', CANVAS_WIDTH / 2, 150 + bounce);

        // Animated Rabbits Preview
        const time = Date.now() / 150;
        const hopP1 = Math.abs(Math.sin(time)) * 14;
        const hopP2 = Math.abs(Math.cos(time)) * 14;

        // Draw animated rabbit 1
        this.p1.x = CANVAS_WIDTH / 2 - 80;
        this.p1.y = 175 - hopP1;
        this.p1.facing = 1;
        this.p1.draw(ctx);

        // Draw animated rabbit 2
        this.p2.x = CANVAS_WIDTH / 2 + 50;
        this.p2.y = 175 - hopP2;
        this.p2.facing = -1;
        this.p2.draw(ctx);

        // "1 Player" Button
        this.drawArcadeButton(ctx, 250, 230, 300, 50, '1 PLAYER (WASD)', '#2563eb', '#60a5fa');

        // "2 Player Co-op" Button
        this.drawArcadeButton(ctx, 250, 300, 300, 50, '2 PLAYER CO-OP', '#d97706', '#fbbf24');

        // High Score
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`🏆 TOP HIGH SCORE: ${this.highScore}`, CANVAS_WIDTH / 2, 385);

        ctx.font = '11px "Outfit", sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText('Press WASD or Arrow Keys &bull; Collect Carrots &bull; Defeat Stage Bosses', CANVAS_WIDTH / 2, 420);

        ctx.restore();
      }

      drawPauseScreen(ctx) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px "Press Start 2P", monospace';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText('GAME PAUSED', CANVAS_WIDTH / 2, 140);

        this.drawArcadeButton(ctx, 300, 190, 200, 44, 'RESUME', '#16a34a', '#4ade80');
        this.drawArcadeButton(ctx, 300, 250, 200, 44, 'RESTART', '#2563eb', '#60a5fa');
        this.drawArcadeButton(ctx, 300, 310, 200, 44, 'MAIN MENU', '#475569', '#94a3b8');

        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Press ESC to Resume', CANVAS_WIDTH / 2, 390);

        ctx.restore();
      }

      drawStageClearScreen(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';

        ctx.font = 'bold 26px "Press Start 2P", monospace';
        ctx.fillStyle = '#4ade80';
        ctx.shadowColor = '#22c55e';
        ctx.shadowBlur = 14;
        ctx.fillText(`STAGE ${this.currentStage} CLEARED!`, CANVAS_WIDTH / 2, 130);
        ctx.shadowBlur = 0;

        ctx.font = '13px "Outfit", sans-serif';
        ctx.fillStyle = '#f8fafc';
        const totalCarrots = this.p1.carrotsCollected + (this.isTwoPlayer ? this.p2.carrotsCollected : 0);
        const totalScore = this.p1.score + (this.isTwoPlayer ? this.p2.score : 0);
        ctx.fillText(`Total Carrots Collected: 🥕 ${totalCarrots}`, CANVAS_WIDTH / 2, 180);
        ctx.fillText(`Current Team Score: ⭐️ ${totalScore}`, CANVAS_WIDTH / 2, 210);

        const nextLabel = this.currentStage < this.maxStages
          ? `CONTINUE TO STAGE ${this.currentStage + 1}`
          : 'VIEW VICTORY';
        this.drawArcadeButton(ctx, 250, 280, 300, 52, nextLabel, '#16a34a', '#4ade80');

        ctx.restore();
      }

      drawGameOverScreen(ctx) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';

        ctx.font = 'bold 30px "Press Start 2P", monospace';
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 16;
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 140);
        ctx.shadowBlur = 0;

        const totalScore = this.p1.score + (this.isTwoPlayer ? this.p2.score : 0);
        ctx.font = '11px "Press Start 2P", monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(`FINAL SCORE: ${totalScore}`, CANVAS_WIDTH / 2, 200);

        if (totalScore >= this.highScore && totalScore > 0) {
          ctx.fillStyle = '#facc15';
          ctx.fillText('★ NEW HIGH SCORE! ★', CANVAS_WIDTH / 2, 235);
        } else {
          ctx.fillStyle = '#94a3b8';
          ctx.fillText(`BEST SCORE: ${this.highScore}`, CANVAS_WIDTH / 2, 235);
        }

        this.drawArcadeButton(ctx, 280, 280, 240, 48, 'TRY AGAIN', '#2563eb', '#60a5fa');
        this.drawArcadeButton(ctx, 280, 345, 240, 45, 'MAIN MENU', '#475569', '#94a3b8');

        ctx.restore();
      }

      drawVictoryScreen(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';

        ctx.font = 'bold 26px "Press Start 2P", monospace';
        ctx.fillStyle = '#facc15';
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 20;
        ctx.fillText('VICTORY!', CANVAS_WIDTH / 2, 110);
        ctx.shadowBlur = 0;

        ctx.font = '12px "Press Start 2P", monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('ALL 3 STAGES COMPLETED!', CANVAS_WIDTH / 2, 150);

        ctx.font = '13px "Outfit", sans-serif';
        ctx.fillStyle = '#f8fafc';
        const totalScore = this.p1.score + (this.isTwoPlayer ? this.p2.score : 0);
        const totalCarrots = this.p1.carrotsCollected + (this.isTwoPlayer ? this.p2.carrotsCollected : 0);
        ctx.fillText('You saved the Carrot Kingdom from the Fox Overlords! 👑', CANVAS_WIDTH / 2, 195);
        ctx.fillText(`Total Carrots: 🥕 ${totalCarrots}  |  Total Score: ⭐️ ${totalScore}`, CANVAS_WIDTH / 2, 225);

        this.drawArcadeButton(ctx, 280, 280, 240, 48, 'PLAY AGAIN', '#16a34a', '#4ade80');
        this.drawArcadeButton(ctx, 280, 345, 240, 45, 'MAIN MENU', '#475569', '#94a3b8');

        ctx.restore();
      }

      drawArcadeButton(ctx, x, y, w, h, text, colorDark, colorLight) {
        ctx.save();
        // Drop shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.roundRect(x, y + 4, w, h, 12);
        ctx.fill();

        // Main button body
        const grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, colorLight);
        grad.addColorStop(1, colorDark);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 12);
        ctx.fill();

        // Border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Label
        ctx.font = 'bold 11px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 4;
        ctx.fillText(text, x + w / 2, y + h / 2 + 1);

        ctx.restore();
      }

      // 60FPS Game Loop
      loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
      }
    }

    // Initialize Game
    window.addEventListener('DOMContentLoaded', () => {
      const game = new RabbitRunnerGame();
      game.loop();
    });

  })();
  </script>
</body>
</html>
